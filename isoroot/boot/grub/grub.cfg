set timeout=5
set default=0

insmod multiboot2
insmod all_video
insmod vbe
insmod vga

set gfxmode=1024x768x32,1024x768,800x600x32,800x600,auto
set gfxpayload=keep

menuentry "HamixOS v0.1.0 (live, ramdisk root)" {
    multiboot2 /boot/kernel.bin
    module2 /boot/initramfs.tar initramfs.tar
    module2 /boot/disk.img disk.img
    boot
}
