# HamixOS login configuration, read by the kernel every time someone logs in.
#
# shell              program started after a successful login (any static
#                    HamixOS binary; hsh lives in /usr/bin/hsh)
# shell_args         arguments passed to the shell
# desktop            the graphical session started by `startx` and autostart
# autostart_desktop  yes = start the desktop right after login,
#                    no  = stay in the text shell (type `startx` for Nook)

shell=/usr/bin/hsh
shell_args=-l
desktop=/usr/bin/hxserver
autostart_desktop=no
