[workspace]
members = [
    "kernel",
    "sdk/hamix_kpi",
    "crates/*",
    "hxlibc/rust/*",
    "vendor/*",
    "userland/*/*",
    "modules/*",
    "layers/linux/compat/*",
    "tools/mkhext",
]
exclude = ["vendor/smoltcp", "tools/xtask", "modules/e1000e"]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 2

[profile.module]
inherits = "release"
panic = "abort"
opt-level = 2
lto = "fat"
codegen-units = 1
debug = false
