[package]
name = "hxtoolkit"
version = "0.1.0"
edition = "2021"
description = "Declarative desktop UI toolkit: one application code base, native look on the HamixOS Nook desktop and in GTK desktops (GNOME, KDE, Enlightenment, ...)"
license = "MIT"
keywords = ["gui", "toolkit", "gtk", "declarative", "no_std"]
categories = ["gui", "no-std"]

[lib]
path = "src/lib.rs"

[features]
default = []
std = []
nook = ["dep:hxproto", "dep:vellum", "dep:wlclient"]
gtk = ["std", "dep:gtk4"]

[dependencies]
hxproto = { path = "../hxproto", version = "0.1", optional = true, features = ["client"] }
wlclient = { path = "../wlclient", version = "0.1", optional = true }
vellum = { path = "../vellum", version = "0.2", optional = true }
gtk4 = { version = "0.10", optional = true, features = ["v4_10"] }
