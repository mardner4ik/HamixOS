[package]
name = "hxserver"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "hxserver"
path = "src/main.rs"

[features]
default = ["wayland"]
wayland = ["dep:wlwire"]

[dependencies]
hxstd = { path = "../../libs/hxstd" }
vellum = { path = "../../../crates/vellum" }
imago = { path = "../../../crates/imago" }
hxproto = { path = "../../../crates/hxproto" }
hxclient = { path = "../../libs/hxclient" }
wlwire = { path = "../../../crates/wlwire", optional = true }

[package.metadata.hamix]
desktop = "nook"
