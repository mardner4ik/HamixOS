# hxboot -- the HamixOS boot loader menu.
#
# This file is plain text: edit it by hand or with `hxbootctl` (hxbootctl help).
# Lines starting with # are comments. Every entry starts with `entry TITLE`;
# the lines below it, up to the next `entry`, belong to it.
#
# Global settings
#   title TEXT        heading of the menu
#   timeout SECONDS   how long the menu waits; 0 boots at once (hold Shift to see the menu)
#   default N         the entry booted when nobody presses a key, counted from 0
#   probe yes|no      look for other operating systems on the hard disks at every boot
#
# Entry lines
#   kernel PATH ARGS  a multiboot2 kernel and its command line
#   module PATH NAME  a file loaded next to the kernel (module? PATH NAME: skipped when missing)
#   text              keep the text screen, do not switch to graphics
#   chain signature=XXXXXXXX partition=N
#                     start another system from its own boot sector; the disk is found by
#                     the MBR disk signature (`hxbootctl probe` prints it), partition 0 is the
#                     whole disk (its MBR), 1..4 a primary partition.
#                     drive=hd1 or drive=0x81 works too, but BIOS disk numbers can change.
#   reboot            restart the computer
#
# Adding another system by hand, for example:
#
#   entry Windows 10
#   chain signature=0c0ffee0 partition=2
#
#   entry OpenBSD
#   chain signature=5e6f7a8b partition=4
#
#   entry Linux (its GRUB on the second disk)
#   chain drive=hd1 partition=0
#
# Keys in the menu: Up/Down/Home/End choose, Enter or 1..9 boots, e edits the kernel
# command line for this boot only, Esc leaves the editor.

title HamixOS 0.7
timeout 3
default 0
probe yes

entry HamixOS 0.7 Live
kernel /boot/kernel.bin root=live
module /boot/initfs.tar initfs

entry HamixOS 0.7 Live (copy the whole system into RAM)
kernel /boot/kernel.bin root=ram
module /boot/hext.img hext
module /boot/initfs.tar initfs

entry HamixOS 0.7 (use the system installed on disk)
kernel /boot/kernel.bin root=auto
module? /boot/hext.img hext
module /boot/initfs.tar initfs

entry HamixOS 0.7 Live (safe graphics, no driver modules)
kernel /boot/kernel.bin root=live nomodules

entry Reboot
reboot
