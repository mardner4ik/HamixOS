set timeout=3
set default=0

insmod multiboot2
insmod all_video
insmod vbe
insmod vga
insmod regexp

set gfxmode=1024x768x32,1024x768,800x600x32,800x600,auto
set gfxpayload=keep

menuentry "HamixOS 0.7 Live" {
    multiboot2 /boot/kernel.bin root=live
    if regexp '^(cd|hd9[6-9]|hd1[0-2][0-9])' "$root"; then
        true
    else
        if module2 /boot/hext.img hext; then
            true
        else
            echo "Could not read /boot/hext.img (323 MiB) through the BIOS, trying again..."
            if module2 /boot/hext.img hext; then
                true
            else
                echo "The BIOS could not load the image; the kernel will read the USB stick itself."
                sleep 3
            fi
        fi
    fi
    module2 /boot/initfs.tar initfs
    boot
}

menuentry "HamixOS 0.7 Live from a USB stick (the kernel reads the stick, not the BIOS)" {
    multiboot2 /boot/kernel.bin root=live
    module2 /boot/initfs.tar initfs
    boot
}

menuentry "HamixOS 0.7 (use the system installed on disk)" {
    multiboot2 /boot/kernel.bin root=auto
    if module2 /boot/hext.img hext; then
        true
    else
        echo "Could not read /boot/hext.img (323 MiB) through the BIOS, trying again..."
        if module2 /boot/hext.img hext; then
            true
        else
            echo "The system image could not be loaded. Write the USB stick again or boot from a DVD."
            sleep 20
        fi
    fi
    module2 /boot/initfs.tar initfs
    boot
}

menuentry "HamixOS 0.7 Live (copy the whole system into RAM)" {
    multiboot2 /boot/kernel.bin root=ram
    if module2 /boot/hext.img hext; then
        true
    else
        echo "Could not read /boot/hext.img (323 MiB) through the BIOS, trying again..."
        if module2 /boot/hext.img hext; then
            true
        else
            echo "The system image could not be loaded. Write the USB stick again or boot from a DVD."
            sleep 20
        fi
    fi
    module2 /boot/initfs.tar initfs
    boot
}

menuentry "HamixOS 0.7 Live (safe graphics, no driver modules)" {
    multiboot2 /boot/kernel.bin root=live nomodules
    if regexp '^(cd|hd9[6-9]|hd1[0-2][0-9])' "$root"; then
        true
    else
        if module2 /boot/hext.img hext; then
            true
        else
            echo "Could not read /boot/hext.img (323 MiB) through the BIOS, trying again..."
            if module2 /boot/hext.img hext; then
                true
            else
                echo "The system image could not be loaded. Write the USB stick again or boot from a DVD."
                sleep 20
            fi
        fi
    fi
    boot
}
