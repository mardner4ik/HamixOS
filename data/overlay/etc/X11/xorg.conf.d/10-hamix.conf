Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier "HamixOS KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ShadowFB" "on"
EndSection

Section "InputClass"
    Identifier "libinput everything"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection
